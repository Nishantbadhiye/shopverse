apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: workshop

spec:
  replicas: 1

  selector:
    matchLabels:
      app: mysql

  template:
    metadata:
      labels:
        app: mysql

    spec:
      containers:
        - name: mysql
          image: mysql:8.0

          ports:
            - containerPort: 3306

          env:
 
            - name: MYSQL_DATABASE
              value: shopverse
            - name: MYSQL_USER
              value: shopverse
            - name: MYSQL_PASSWORD
              value: shopverse123
 
          volumeMounts:
            - name: mysql-volume
              mountPath: /var/lib/mysql

      volumes:
        - name: mysql-volume
          persistentVolumeClaim:
            claimName: mysql-pvc
