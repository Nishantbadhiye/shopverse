apiVersion: apps/v1
kind: Deployment

metadata:
  name: api
  namespace: workshop
  labels:
    role: api
    env: demo

spec:
  replicas: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 25%

  selector:
    matchLabels:
      role: api

  template:
    metadata:
      labels:
        role: api

    spec:
      containers:
      - name: api
        image: nishantbadhiye07/shopverse-backend:build-25
        imagePullPolicy: Always

        env:
        - name: DB_HOST
          value: mysql

        - name: DB_PORT
          value: "3306"

        - name: DB_USER
          value: shopverse

        - name: DB_PASSWORD
          value: shopverse123

        - name: DB_NAME
          value: shopverse

        ports:
        - containerPort: 8080
